name: CI

# Format check, clippy, build, unit tests, and the command line and
# round-trip tests of lxr_backup / lxr_restore.
# Mirrors .forgejo/workflows/CI-nix.yaml.

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch: {}

permissions:
  contents: read

env:
  # keep in sync with rust-version in Cargo.toml and .forgejo/images/ci/pins.nix
  RUST_VERSION: "1.99.0"

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install the pinned Rust toolchain
        run: |
          rustup toolchain install "$RUST_VERSION" --profile minimal --component rustfmt,clippy
          rustup default "$RUST_VERSION"

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --locked --all-targets -- -D warnings

      - name: Build
        run: cargo build --locked --release

      - name: Unit tests
        run: cargo test --locked

      - name: Command line tests
        run: bash tests/test_cli.sh target/release

      - name: Round-trip test
        run: bash tests/roundtrip.sh

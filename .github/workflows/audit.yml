name: audit

# Dependency audit with cargo-deny (deny.toml): RustSec advisories, licenses,
# banned/duplicate crates, allowed sources.
# Runs when dependencies change and weekly, so new advisories against
# unchanged dependencies are noticed too.
# Mirrors .forgejo/workflows/audit.yaml.

on:
  push:
    branches: [ main ]
    paths:
      - Cargo.lock
      - Cargo.toml
      - deny.toml
      - .github/workflows/audit.yml
  pull_request:
    paths:
      - Cargo.lock
      - Cargo.toml
      - deny.toml
      - .github/workflows/audit.yml
  schedule:
    - cron: "17 5 * * 1"
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  cargo-deny:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install cargo-deny
        run: cargo install --locked cargo-deny

      - name: cargo deny check
        run: cargo deny check

# Builds and pushes the image that CI-nix.yaml runs in.
#
# Setup (once):
#   - repository variable CI_IMAGE   e.g. code.sbclab.net/elykseer/elykseer-rs-ci:latest
#   - repository secrets REGISTRY_USER and REGISTRY_TOKEN (token with package:write)
#   - the job runs in the image itself and talks to the docker daemon of the
#     runner host (dind) on tcp port 2375 of the container's gateway.
# Until the image exists, build it by hand: ci/build-image.sh "$CI_IMAGE" --push
name: image

on:
  push:
    branches: [main]
    paths:
      - .forgejo/images/**
      - ci/build-image.sh
      - .forgejo/workflows/image.yaml
  workflow_dispatch:

jobs:
  image:
    runs-on: nixos-amd64
    container:
      image: ${{ vars.CI_IMAGE }}
      credentials:
        username: ${{ secrets.REGISTRY_USER }}
        password: ${{ secrets.REGISTRY_TOKEN }}
    steps:
      - name: Check out repository code
        uses: https://data.forgejo.org/actions/checkout@v4
        with:
          submodules: false

      - name: Log in to the registry
        env:
          CI_IMAGE: ${{ vars.CI_IMAGE }}
          REGISTRY_USER: ${{ secrets.REGISTRY_USER }}
          REGISTRY_TOKEN: ${{ secrets.REGISTRY_TOKEN }}
        run: echo "$REGISTRY_TOKEN" | docker login "${CI_IMAGE%%/*}" -u "$REGISTRY_USER" --password-stdin

      - name: discover and wait for docker daemon
        run: |
          GW_HEX=$(awk '$2 == "00000000" {print $3}' /proc/net/route | head -1)
          GW_IP=$(printf '%d.%d.%d.%d' 0x${GW_HEX:6:2} 0x${GW_HEX:4:2} 0x${GW_HEX:2:2} 0x${GW_HEX:0:2})
          echo "gateway IP: ${GW_IP}"
          echo "DOCKER_HOST=tcp://${GW_IP}:2375" >> "$GITHUB_ENV"
          export DOCKER_HOST="tcp://${GW_IP}:2375"
          for i in $(seq 1 20); do
            if docker version >/dev/null 2>&1; then
              echo "docker reachable via ${DOCKER_HOST} (try $i)"
              exit 0
            fi
            echo "docker daemon not reachable yet (try $i)..."; sleep 3
          done
          echo "--- diagnostics ---"
          echo "gateway: ${GW_IP}"
          echo "nc -zv ${GW_IP} 2375:"; nc -zv "${GW_IP}" 2375 || true
          echo "/proc/net/route:"; cat /proc/net/route || true
          echo "docker version, full error:"; docker version || true
          echo "docker daemon never became reachable"; exit 1

      # TEMPORARY: remove once the image builds
      - name: network diagnostics
        run: |
          for u in https://github.com https://codeload.github.com https://cache.nixos.org https://static.rust-lang.org; do
            echo "== dind bridge: $u"; docker run --rm curlimages/curl -sS -o /dev/null -m 20 -w '%{http_code} %{remote_ip}\n' "$u" || true
            echo "== dind host:   $u"; docker run --rm --network host curlimages/curl -sS -o /dev/null -m 20 -w '%{http_code} %{remote_ip}\n' "$u" || true
          done
          docker run --rm busybox cat /etc/resolv.conf
          docker run --rm busybox nslookup github.com || true

      # network=host: containers on the dind bridge cannot reach github.com
      # (rust-overlay tarball), the dind host network (= runner pod) can.
      # The dind daemon outlives the job, so a BuildKit container of an earlier
      # run (possibly without network=host) would be reused: remove it first.
      - name: Set up Docker Buildx
        run: |
          docker rm -f buildx_buildkit_multiarch-builder0 2>/dev/null || true
          docker buildx create --name multiarch-builder --driver docker-container --driver-opt network=host --use
          docker buildx inspect --bootstrap
          echo "BuildKit container network: $(docker inspect -f '{{.HostConfig.NetworkMode}}' buildx_buildkit_multiarch-builder0)"
          docker exec buildx_buildkit_multiarch-builder0 wget -q -O /dev/null -T 20 https://github.com && echo "BuildKit reaches github.com"

      - name: Build and push
        env:
          CI_IMAGE: ${{ vars.CI_IMAGE }}
        run: docker buildx build --platform linux/amd64,linux/arm64 -t "$CI_IMAGE" -f .forgejo/images/ci/Dockerfile .forgejo/images/ci --push
